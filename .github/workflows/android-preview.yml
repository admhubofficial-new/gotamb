name: Android Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Android export check
        run: npx expo export --platform android --clear

      - name: Check Expo authentication
        id: expo-auth
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Expo token is available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is not configured; EAS build will be skipped."
          fi

      - name: Build Android preview APK on EAS
        if: steps.expo-auth.outputs.available == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait

      - name: Explain skipped EAS build
        if: steps.expo-auth.outputs.available != 'true'
        run: |
          echo "Validation passed, but EAS build could not start because the repository does not expose an EXPO_TOKEN secret to this workflow."
