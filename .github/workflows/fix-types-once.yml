name: One-time TypeScript patch

on:
  push:
    paths:
      - '.github/workflows/fix-types-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply targeted fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          order = Path('src/app/customer-order.tsx')
          text = order.read_text()
          text = text.replace('durationText(routeQuote.durationSeconds)', 'durationText(routeQuote?.durationSeconds ?? 0)')
          text = text.replace("routeQuote.source === 'google_routes'", "routeQuote?.source === 'google_routes'")
          order.write_text(text)

          fleets = Path('src/app/vendor-fleets.tsx')
          text = fleets.read_text()
          text = text.replace("const [capacity, setCapacity] = useState(vehiclePresets[1].capacity);", "const [capacity, setCapacity] = useState<string>(vehiclePresets[1].capacity);")
          fleets.write_text(text)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/customer-order.tsx src/app/vendor-fleets.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: resolve checkout and fleet TypeScript types"
          git push origin HEAD:main
